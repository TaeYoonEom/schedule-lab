services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: schedule_lab
      POSTGRES_USER: schedule_lab
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: